                { id: 'parcela-lua-mel-2', titulo: 'Parcela da Lua de Mel', preco: 2000, imagem: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop' },
                { id: 'parcela-lua-mel-3', titulo: 'Parcela da Lua de Mel', preco: 3500, imagem: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop' },
                { id: 'massagem', titulo: 'Massagem dupla', preco: 400, imagem: 'https://dcdn-us.mitiendanube.com/stores/001/398/332/products/dupla-massagem1-0f0e60612a378639d916161856343845-640-0.jpg' },

                { id: 'tour-sorvete', titulo: 'Tour do sorvete', preco: 120, imagem: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTW7qcBSbH0DmDt-iHSBj-1ymljC7xCLOgl3cjGqRR621KJDJ3JgPfAjTyCO-SRaYgsXoc&usqp=CAU' },
                { id: 'karaoke-night', titulo: 'Noite de karaokê', preco: 150, imagem: 'https://img.freepik.com/fotos-premium/amigos-felizes-cantando-no-karaoke_107420-27664.jpg?semt=ais_hybrid&w=740&q=80' },
                { id: 'escape-room', titulo: 'Escape room do casal', preco: 250, imagem: 'https://www.elhombre.com.br/wp-content/uploads/2016/07/escape.jpg' },
                { id: 'bate-volta-praia', titulo: 'Bate-volta na praia', preco: 300, imagem: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200&auto=format&fit=crop' },
                { id: 'mirante', titulo: 'Visita ao mirante da cidade', preco: 100, imagem: 'https://images.unsplash.com/photo-1470770903676-69b98201ea1c?q=80&w=1200&auto=format&fit=crop' },
                { id: 'jogo-tabuleiro', titulo: 'Noite de jogos de tabuleiro', preco: 195, imagem: 'https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop' },
                { id: 'delivery-gourmet', titulo: 'Delivery gourmet do casal', preco: 250, imagem: 'https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=1200&auto=format&fit=crop' },
                { id: 'assinatura-cafe', titulo: 'Assinatura de café (3 meses)', preco: 240, imagem: 'https://cafeteiratres.com/wp-content/uploads/2019/05/assinatura-de-cafe-vale-a-pena.jpg' },
                { id: 'taxi-aeroporto', titulo: 'Táxi/transfer aeroporto', preco: 200, imagem: 'https://unityvans.com.br/wp-content/uploads/Transfer-Aeroporto-Taxi-Executivo.jpg' },
                { id: 'parque-diversoes', titulo: 'Dia no parque de diversões', preco: 400, imagem: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuJnoDsLYfNmZ6Xma8aIYeuCJoaMPee4NV6Q&s' },
                { id: 'churrasco-amigos', titulo: 'Churrasco entre amigos', preco: 450, imagem: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTllpw_Z4e2glX4QReCA9ZyIwnE63u75U450w&s' },
                { id: 'mini-viagem', titulo: 'Mini viagem a dois', preco: 500, imagem: 'https://palacepraia.com.br/wp-content/uploads/2021/06/viajar-a-dois.jpg' },
                { id: 'aula-cozinha', titulo: 'Aula de cozinha a dois', preco: 350, imagem: 'https://f.i.uol.com.br/fotografia/2025/04/24/1745509665680a5d217abce_1745509665_3x2_md.jpg' },
                { id: 'fotolivro', titulo: 'Fotolivro do casamento', preco: 300, imagem: 'https://img.elo7.com.br/product/zoom/243CD39/fotolivro-casamento-21x30-capa-dura-para-80-fotos-foto.jpg' },
                { id: 'flores-mes', titulo: 'Flores por 3 meses', preco: 400, imagem: 'https://casa.abril.com.br/wp-content/uploads/2020/07/florista-dc3a1-dica-de-cuidado-com-flores-e-plantas-em-casa-rosas-casacom-5.jpg?quality=70&strip=info&w=1024' },
                { id: 'spa-maos-pes', titulo: 'Spa mãos & pés', preco: 200, imagem: 'https://conceitohoteleiro.blancspa.com.br/wp-content/uploads/2021/01/Spa-dos-Pes-e-Maos.jpg' },
                { id: 'aula-surf', titulo: 'Aula de surf a dois', preco: 500, imagem: 'https://images.unsplash.com/photo-1493558103817-58b2924bce98?q=80&w=1200&auto=format&fit=crop' },
                { id: 'trilha-amanhecer', titulo: 'Trilha ao amanhecer', preco: 250, imagem: 'https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1200&auto=format&fit=crop' },
                { id: 'piquenique-premium', titulo: 'Piquenique premium', preco: 300, imagem: 'https://i.pinimg.com/originals/80/a0/c3/80a0c303f70f5aa73458766b3c467de9.jpg' }
            ];

            

            const grid = document.getElementById('presentes-grid');
            grid.innerHTML = '';
            const fallbackImg = 'https://images.unsplash.com/photo-1470167290877-7d7d0db6f4df?q=80&w=1200&auto=format&fit=crop';
            presentes.forEach(item => {
                const card = document.createElement('div');
                card.className = 'gift-card';
                card.innerHTML = `
                    <img class="gift-img" src="${item.imagem}" alt="${item.titulo}" onerror="this.src='${fallbackImg}'; this.onerror=null;">
                    <div class="gift-body">
                        <div class="gift-title">${item.titulo.toUpperCase()}</div>
                        <div class="gift-price">R$ ${item.preco.toFixed(2).replace('.', ',')}</div>
                        <div class="gift-actions"><button class="btn-comprar" data-id="${item.id}">Comprar</button></div>
                    </div>
                `;
                grid.appendChild(card);
            });

            const modal = document.getElementById('modal-presente');
            const btnFechar = document.getElementById('btn-fechar-presente');
            const detalheImg = document.getElementById('detalhe-img');
            const detalheTitulo = document.getElementById('detalhe-titulo');
            const detalhePreco = document.getElementById('detalhe-preco');
            const btnPagar = document.getElementById('btn-pagar');
            const paymentMethodEl = document.getElementById('payment-method');
            const installmentsEl = document.getElementById('installments');
            let itemAtual = null;

            async function startCheckout(item) {
                if (linkConfig.handle) {
                    const url = buildIntegratedCheckoutUrl(item);
                    window.location.href = url;
                    return;
                }
                if (item.pagamento && /^https?:\/\//.test(item.pagamento)) {
                    window.location.href = item.pagamento;
                    return;
                }
                try {
                    const resp = await fetch('/api/checkout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            title: item.titulo,
                            amount: item.preco,
                            payment_method: 'credit',
                            installments: 1
                        })
                    });
                    const data = await resp.json();
                    if (data.checkout_url) {
                        window.location.href = data.checkout_url;
                    }
                } catch (err) {}
            }

            grid.addEventListener('click', function(e){
                const botao = e.target.closest('.btn-comprar');
                if (!botao) return;
                const id = botao.getAttribute('data-id');
                const item = presentes.find(p => p.id === id);
                if (!item) return;
                itemAtual = item;
                startCheckout(item);
            });

            btnFechar.addEventListener('click', function(){
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
            });

            modal.addEventListener('click', function(e){
                if (e.target === modal) {
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }
            });

            const infinitePayConfig = {
                handle: 'SEU_HANDLE',
                doc_number: 'SEU_CNPJ_SEM_PONTOS',
                result_url: 'seuapp://tap_result',
                app_client_referrer: 'CasamentoWeb',
                force_ios_deeplink: true
            };

            const linkConfig = {
                handle: 'werisder-bertoli',
                redirectUrl: 'https://werisbertoli.github.io/convite-casamento/presentes.html'
            };

            function buildIntegratedCheckoutUrl(item) {
                const cents = Math.max(100, Math.round(item.preco * 100));
                const items = encodeURIComponent(JSON.stringify([{ name: item.titulo, price: cents, quantity: 1 }]));
                const redirect = encodeURIComponent(linkConfig.redirectUrl);
                return `https://checkout.infinitepay.io/${linkConfig.handle}?items=${items}&order_nsu=${encodeURIComponent(item.id)}&redirect_url=${redirect}`;
            }

            if (linkConfig.handle) {
                presentes.forEach(item => {
                    item.pagamento = buildIntegratedCheckoutUrl(item);
                });
            }

            function buildInfinitePayUrl(valor, metodo, parcelas) {
                const cents = Math.max(100, Math.round(valor * 100));
                const params = new URLSearchParams();
                params.set('amount', String(cents));
                params.set('payment_method', metodo);
                if (metodo === 'credit') params.set('installments', String(parcelas));
                params.set('order_id', String(Date.now()));
                params.set('result_url', encodeURIComponent(infinitePayConfig.result_url));
                params.set('app_client_referrer', infinitePayConfig.app_client_referrer);
                if (infinitePayConfig.handle) params.set('handle', infinitePayConfig.handle);
                if (infinitePayConfig.doc_number) params.set('doc_number', infinitePayConfig.doc_number);
                if (infinitePayConfig.force_ios_deeplink) params.set('af_force_deeplink', 'true');
                return `infinitepaydash://infinitetap-app?${params.toString()}`;
            }

            paymentMethodEl.addEventListener('change', function(){
                installmentsEl.disabled = this.value !== 'credit';
            });

            btnPagar.addEventListener('click', function(){
                if (!itemAtual) return;
                const url = buildIntegratedCheckoutUrl(itemAtual);
                window.location.href = url;
            });

            const qs = new URLSearchParams(location.search);
            const transactionId = qs.get('transaction_id');
            const orderNsu = qs.get('order_nsu');
            const slug = qs.get('slug');
            const receiptUrl = qs.get('receipt_url');
            if (transactionId && slug && linkConfig.handle && linkConfig.handle !== 'SEU_HANDLE') {
                const parts = [`transaction_nsu=${encodeURIComponent(transactionId)}`, `slug=${encodeURIComponent(slug)}`];
                if (orderNsu) parts.push(`external_order_nsu=${encodeURIComponent(orderNsu)}`);
                const u = `https://api.infinitepay.io/invoices/public/checkout/payment_check/${linkConfig.handle}?${parts.join('&')}`;
                fetch(u).then(r=>r.json()).then(async d=>{
                    const existing = document.getElementById('payment-banner');
                    if (existing) existing.remove();
                    const bar = document.createElement('div');
                    bar.id='payment-banner';
                    bar.style.position='fixed';
                    bar.style.top='0';
                    bar.style.left='0';
                    bar.style.right='0';
                    bar.style.padding='12px 56px 12px 12px';
                    bar.style.minHeight='48px';
                    bar.style.background=d.paid?'#d4edda':'#fff3cd';
                    bar.style.color='#333';
                    bar.style.textAlign='center';
                    bar.style.zIndex='2000';
                    bar.style.boxShadow='0 2px 12px rgba(0,0,0,0.2)';
                    bar.style.borderBottom='1px solid rgba(0,0,0,0.1)';
                    const text = document.createElement('span');
                    text.textContent = d.paid ? 'Pagamento confirmado. Obrigado!' : 'Pagamento pendente.';
                    text.style.fontWeight='600';
                    document.body.appendChild(bar);
                    bar.appendChild(text);
                    if (receiptUrl) {
                        const link = document.createElement('a');
                        link.href = receiptUrl;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = 'Ver comprovante';
                        link.style.marginLeft = '12px';
                        link.style.fontWeight = '600';
                        link.style.textDecoration = 'underline';
                        link.style.color = d.paid ? '#155724' : '#856404';
                        bar.appendChild(link);
                    }
                    const close = document.createElement('button');
                    close.textContent = 'Fechar';
                    close.style.position='absolute';
                    close.style.right='12px';
                    close.style.top='8px';
                    close.style.border='none';
                    close.style.background='transparent';
                    close.style.cursor='pointer';
                    close.style.fontWeight='600';
                    close.style.color='#333';
                    close.addEventListener('click', function(){ bar.remove(); });
                    bar.appendChild(close);
                    if (d.paid && orderNsu) {
                        try {
                            await setDoc(doc(db, 'gifts', orderNsu), { status: 'sold', transaction_nsu: transactionId, slug: slug, updatedAt: new Date().toISOString() }, { merge: true });
                            const btn = document.querySelector(`.btn-comprar[data-id="${orderNsu}"]`);
                            if (btn) {
                                btn.textContent = 'Indisponível';
                                btn.disabled = true;
                                const card = btn.closest('.gift-card');
                                if (card) { card.style.opacity = '0.6'; }
                            }
                        } catch (e) {}
                    }
                }).catch(()=>{});
            }

            async function loadSoldIds() {
                try {
                    const snap = await getDocs(collection(db, 'gifts'));
                    const set = new Set();
                    snap.forEach(d => { const v = d.data(); if (v && v.status === 'sold') set.add(d.id); });
                    return set;
                } catch (e) { return new Set(); }
            }

            const sold = await loadSoldIds();
            if (sold.size > 0) {
                presentes.forEach(item => {
                    if (sold.has(item.id)) {
                        const btn = document.querySelector(`.btn-comprar[data-id="${item.id}"]`);
                        if (btn) {
                            btn.textContent = 'Indisponível';
                            btn.disabled = true;
                            const card = btn.closest('.gift-card');
                            if (card) { card.style.opacity = '0.6'; }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
